Use referenced but not meaningfully relied upon when stare decisis is mentioned but rejected, treated as irrelevant or unpersuasive, or not used in any meaningful way.

Use genuine positive reliance helping produce the result when stare decisis positively supports the dissent’s reasoning or confirms a result also supported by other sources.

Use key determining factor when stare decisis supplies an independent basis for the dissent’s reasoning or is a central determinant of the result.

Do not rely on reasoning from other opinions in the case; consider only the second dissent itself.

Coding guidelines:
Mark a case as included only when the Supreme Court itself explicitly considered a constitutional challenge to federal legislative authority and made a substantive determination about whether the statute or its application was within Congress’s constitutional power.

Include cases that:
- uphold a federal statutory provision against a substantive constitutional challenge;
- invalidate a federal statutory provision on its face or as applied on constitutional grounds;
- use a constitutionally limiting or saving construction that imposes hard constraints on congressional power and removes the application before the Court from the statute’s scope;
- address a genuinely raised and contested constitutional issue, even if the analysis is minimal, or are later relied on for that constitutional proposition;
- explain, develop, or apply the constitutional rule rather than merely citing precedent in passing.

Do not include cases that:
- review state legislation;
- review judicial or executive conduct that does not rely on or implicate congressional legislative authority;
- concern congressional actions unrelated to legislative authority, such as contempt or impeachment;
- are decided only by a lower court on the constitutional issue, with the Supreme Court not addressing it;
- merely apply federal law without explicit constitutional deliberation;
- mention a constitutional challenge but do not address it, expressly decline to answer it, or resolve the case on jurisdictional or unrelated grounds;
- make only trivial references to Congress’s constitutional authority or give summary, unexplained reliance on precedent;
- use a constitutionally motivated clear-statement interpretation that leaves Congress free to override the Court’s statutory assumption.

coding guidelines:
identify every form of cross-statute comparison the opinion substantively uses.

count a comparison only when the opinion actually relies on another statute or statutory scheme to interpret the statute at issue. a mention that is only used to reject relevance does not count. secondary or corroborative use does count.

use:
- modeled/borrowed/incorporated when a statute served as a model, supplied borrowed language, or was incorporated by reference.
- consistent usage when identical or similar language is treated as having the same meaning across statutes.
- meaningful variation when a difference in wording is used to infer a difference in meaning, often because another statute shows how congress expresses an alternative rule.
- superfluity when the comparison avoids an interpretation that would make another provision do redundant work.
- harmonization when the opinion reconciles interacting statutes or interprets one statute so it works coherently with another.
- inconclusive when the coded comparison is invoked but does not yield any determinate inference.

do not use inconclusive merely because the evidence is hard to evaluate.

## Opinion text
{{OPINION_TEXT}}

Coding guidelines:
Identify every form of cross-statute comparison the opinion substantively uses.

Count a comparison only when the opinion actually relies on another statute or statutory scheme to interpret the statute at issue. A mention that is only used to reject relevance does not count. Secondary or corroborative use does count.

Use:
- modeled/borrowed/incorporated when a statute served as a model, supplied borrowed language, or was incorporated by reference.
- consistent usage when identical or similar language is treated as having the same meaning across statutes.
- meaningful variation when a difference in wording is used to infer a difference in meaning, often because another statute shows how Congress expresses an alternative rule.
- superfluity when the comparison avoids an interpretation that would make another provision do redundant work.
- harmonization when the opinion reconciles interacting statutes or interprets one statute so it works coherently with another.
- inconclusive when the coded comparison is invoked but does not yield any determinate inference.

Do not use inconclusive merely because the evidence is hard to evaluate.

Allowed labels:
- modeled_borrowed_incorporated: Modeled/borrowed/incorporated
- consistent_usage: Consistent usage
- meaningful_variation: Meaningful variation
- superfluity: Superfluity
- harmonization: Harmonization
- inconclusive: Inconclusive&lt;/pre&gt;

  const skipDelay = 300;
